dependencies:
  # DVP camera driver, for the S3 boards. Nothing on ESP32-P4 uses it.
  espressif/esp32-camera:
    version: "~2.1.5"
    rules:
      - if: "target != esp32p4"
  # CSI camera stack, ESP32-P4 only.
  espressif/esp_cam_sensor:
    version: "0.*"
    rules:
      - if: "target == esp32p4"
  esp_video:
    version: "0.8.*"
    rules:
      - if: "target == esp32p4"
